name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Descompactar o ZIP e localizar o projeto
        run: |
          set -e
          mkdir -p _src
          if [ -d CyberLink.xcodeproj ]; then
            echo "PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            for z in ./*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d _src; done
            for i in 1 2 3; do
              find _src -name '*.zip' | while read -r z; do
                unzip -q -o "$z" -d "$(dirname "$z")" && rm "$z"
              done
            done
            P=$(find _src -name CyberLink.xcodeproj -type d | head -n1)
            if [ -z "$P" ]; then echo "CyberLink.xcodeproj nao encontrado no ZIP"; exit 1; fi
            echo "PROJECT=$GITHUB_WORKSPACE/$(dirname "$P")" >> "$GITHUB_ENV"
          fi

      - name: Versao do Xcode
        run: xcodebuild -version

      - name: Compilar para iPhone (sem assinatura)
        working-directory: ${{ env.PROJECT }}
        run: |
          xcodebuild \
            -project CyberLink.xcodeproj \
            -target CyberLink \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Criar IPA (nao assinado)
        working-directory: ${{ env.PROJECT }}
        run: |
          rm -rf Payload CyberLink.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/CyberLink.app Payload/
          zip -qry CyberLink.ipa Payload
          ls -l CyberLink.ipa

      - name: Guardar IPA
        uses: actions/upload-artifact@v7
        with:
          name: CyberLink-ipa
          path: ${{ env.PROJECT }}/CyberLink.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v${{ github.run_number }}" "${{ env.PROJECT }}/CyberLink.ipa" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CyberLink iPhone v${{ github.run_number }}" \
            --notes "IPA nao assinado. Precisa de ser assinado/instalado com AltStore, Sideloadly ou similar."
